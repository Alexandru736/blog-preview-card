<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Blog preview card</title>
  
</head>
<body>
  <main class="card-wrapper">
    <img src="assets/images/illustration-article.svg" alt="" class="blog-preview-picture">
    <div class="blog-content">
      <div class="blog-category-container">
        <p class="blog-category">Learning</p>
      </div>
      <p class="blog-publish-date">Published 21 Dec 2023</p>
      <h1 class="blog-title"><a href="#">HTML & CSS foundations</a></h1>
      <p class="blog-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>  
    </div>
    <div class="user-profile">
      <img src="assets/images/image-avatar.webp" alt="Greg Hooper" class="user-image">
      <p class="username">Greg Hooper</p>
    </div>
  </main>
</body>
</html>
